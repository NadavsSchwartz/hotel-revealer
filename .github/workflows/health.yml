name: Public health
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-health
  cancel-in-progress: true
jobs:
  health:
    if: vars.HEALTHCHECK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check application and live provider health
        env:
          HEALTH_HOST: ${{ vars.HEALTH_HOST }}
        run: node scripts/check-health.mjs
