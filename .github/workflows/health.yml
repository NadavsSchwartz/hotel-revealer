name: Public health
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Intentionally fail to test notifications without contacting the app'
        type: boolean
        required: false
        default: false
permissions: {}
concurrency:
  group: public-health
  cancel-in-progress: true
jobs:
  health:
    if: vars.HEALTHCHECK_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Intentional alert test (no application request)
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        run: |
          echo '::error title=Intentional alert test::This requested failure tests notification delivery. The application was not contacted.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: Check application and live provider health
        env:
          HEALTH_HOST: ${{ vars.HEALTH_HOST }}
        run: node scripts/check-health.mts
