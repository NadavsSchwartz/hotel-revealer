name: hotel-revealer
services:
  app:
    image: ${APP_IMAGE:?An immutable application image is required}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    env_file:
      - path: /etc/hotel-revealer/runtime.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: "5000"
      PROVIDER_STATE_FILE: /app/var/provider-state.json
    volumes:
      - /var/lib/hotel-revealer/provider:/app/var
    ports:
      - "127.0.0.1:5000:5000"
    stop_grace_period: 45s
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.80
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: ${CADDY_IMAGE:?An immutable Caddy image is required}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?A public domain is required}
      ACME_EMAIL: ${ACME_EMAIL:?A certificate contact is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    pids_limit: 100
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
